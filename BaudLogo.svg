<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="ambGlow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0%" stop-color="#1E40AF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="waveGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="b"/>
      <feFlood flood-color="#22D3EE" flood-opacity="0.22"/>
      <feComposite in2="b" operator="in" result="cb"/>
      <feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="greenGlow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b"/>
      <feFlood flood-color="#34D399" flood-opacity="0.18"/>
      <feComposite in2="b" operator="in" result="cb"/>
      <feMerge><feMergeNode in="cb"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dotGlow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="fadeOut" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827" stop-opacity="1"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeIn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827" stop-opacity="0"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="fadeOutT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827" stop-opacity="1"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeOutB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827" stop-opacity="0"/>
      <stop offset="100%" stop-color="#111827" stop-opacity="1"/>
    </linearGradient>
    <clipPath id="c">
      <rect x="32" y="32" width="960" height="960" rx="216"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>

  <g clip-path="url(#c)">
    <!-- Ambient glow -->
    <rect x="32" y="32" width="960" height="960" fill="url(#ambGlow)"/>

    <!-- Grid (20px spacing scaled to ~38px for 1024 canvas) -->
    <g opacity="0.03" stroke="#fff" stroke-width="0.5">
      <line x1="224" y1="32" x2="224" y2="992"/><line x1="262" y1="32" x2="262" y2="992"/>
      <line x1="300" y1="32" x2="300" y2="992"/><line x1="338" y1="32" x2="338" y2="992"/>
      <line x1="376" y1="32" x2="376" y2="992"/><line x1="414" y1="32" x2="414" y2="992"/>
      <line x1="452" y1="32" x2="452" y2="992"/><line x1="490" y1="32" x2="490" y2="992"/>
      <line x1="528" y1="32" x2="528" y2="992"/><line x1="566" y1="32" x2="566" y2="992"/>
      <line x1="604" y1="32" x2="604" y2="992"/><line x1="642" y1="32" x2="642" y2="992"/>
      <line x1="680" y1="32" x2="680" y2="992"/><line x1="718" y1="32" x2="718" y2="992"/>
      <line x1="756" y1="32" x2="756" y2="992"/><line x1="794" y1="32" x2="794" y2="992"/>
      <line x1="32" y1="224" x2="992" y2="224"/><line x1="32" y1="262" x2="992" y2="262"/>
      <line x1="32" y1="300" x2="992" y2="300"/><line x1="32" y1="338" x2="992" y2="338"/>
      <line x1="32" y1="376" x2="992" y2="376"/><line x1="32" y1="414" x2="992" y2="414"/>
      <line x1="32" y1="452" x2="992" y2="452"/><line x1="32" y1="490" x2="992" y2="490"/>
      <line x1="32" y1="528" x2="992" y2="528"/><line x1="32" y1="566" x2="992" y2="566"/>
      <line x1="32" y1="604" x2="992" y2="604"/><line x1="32" y1="642" x2="992" y2="642"/>
      <line x1="32" y1="680" x2="992" y2="680"/><line x1="32" y1="718" x2="992" y2="718"/>
      <line x1="32" y1="756" x2="992" y2="756"/><line x1="32" y1="794" x2="992" y2="794"/>
    </g>

    <!-- === Far background wave (2 periods, amplitude 180, opacity 0.04) === -->
    <path d="M 80,480
             C 140,295 232,305 296,480
             C 360,655 452,665 512,480
             C 575,298 665,302 728,480
             C 792,658 882,662 944,480"
          fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.04"/>

    <!-- === Mid background wave (2.5 periods, amplitude 130, opacity 0.07) === -->
    <path d="M 80,480
             C 130,352 198,348 253,480
             C 308,612 376,616 426,480
             C 476,348 544,344 599,480
             C 654,616 722,620 772,480
             C 822,344 890,348 944,480"
          fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.07"/>

    <!-- === Near background wave (3 periods, amplitude 90, opacity 0.12) === -->
    <path d="M 80,480
             C 120,392 178,388 224,480
             C 270,572 328,576 368,480
             C 408,388 466,384 512,480
             C 558,576 616,580 656,480
             C 696,384 754,388 800,480
             C 846,580 904,576 944,480"
          fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" opacity="0.12"/>

    <!-- === Secondary analog wave (green, behind main) === -->
    <path d="M 120,580
             C 200,580 220,460 330,460
             C 440,460 430,580 520,580
             C 610,580 600,470 710,470
             C 820,470 810,580 910,580"
          fill="none" stroke="url(#waveGreen)" stroke-width="4" stroke-linecap="round"
          opacity="0.5" filter="url(#greenGlow)"/>

    <!-- === Main square wave — triple glow (hero animation style) === -->
    <!-- Outer glow pass -->
    <path d="M 120,500
             L 250,500
             L 250,320
             L 430,320
             L 430,660
             L 610,660
             L 610,320
             L 790,320
             L 790,500
             L 920,500"
          fill="none" stroke="#22D3EE" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"
          opacity="0.1" filter="url(#bigGlow)"/>
    <!-- Mid glow pass -->
    <path d="M 120,500
             L 250,500
             L 250,320
             L 430,320
             L 430,660
             L 610,660
             L 610,320
             L 790,320
             L 790,500
             L 920,500"
          fill="none" stroke="#22D3EE" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"
          opacity="0.3" filter="url(#glow1)"/>
    <!-- Core line pass -->
    <path d="M 120,500
             L 250,500
             L 250,320
             L 430,320
             L 430,660
             L 610,660
             L 610,320
             L 790,320
             L 790,500
             L 920,500"
          fill="none" stroke="url(#waveCyan)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
          opacity="0.85"/>

    <!-- === Data particles (flowing along the wave) === -->
    <g filter="url(#dotGlow)">
      <!-- Particle 1: first flat section -->
      <circle cx="185" cy="500" r="5" fill="#22D3EE" opacity="0.9"/>
      <!-- Particle 2: first high section -->
      <circle cx="340" cy="320" r="6" fill="#22D3EE" opacity="0.85"/>
      <!-- Particle 3: low section -->
      <circle cx="520" cy="660" r="5" fill="#22D3EE" opacity="0.8"/>
      <!-- Particle 4: second high section -->
      <circle cx="700" cy="320" r="6" fill="#22D3EE" opacity="0.85"/>
      <!-- Particle 5: last flat section -->
      <circle cx="855" cy="500" r="5" fill="#22D3EE" opacity="0.9"/>
    </g>

    <!-- Particle tails -->
    <g stroke="#22D3EE" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3">
      <line x1="185" y1="500" x2="155" y2="500"/>
      <line x1="340" y1="320" x2="310" y2="320"/>
      <line x1="520" y1="660" x2="490" y2="660"/>
      <line x1="700" y1="320" x2="670" y2="320"/>
      <line x1="855" y1="500" x2="825" y2="500"/>
    </g>

    <!-- === TX port node (left) === -->
    <g filter="url(#nodeGlow)">
      <circle cx="120" cy="500" r="20" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.2"/>
      <circle cx="120" cy="500" r="14" fill="#22D3EE" opacity="0.12"/>
      <circle cx="120" cy="500" r="14" fill="none" stroke="#22D3EE" stroke-width="1.2" opacity="0.35"/>
      <circle cx="120" cy="500" r="5" fill="#22D3EE" opacity="0.85"/>
    </g>
    <text x="120" y="536" text-anchor="middle" fill="#22D3EE" font-family="SF Mono, Menlo, monospace" font-size="14" font-weight="500" opacity="0.4">TX</text>

    <!-- === RX port node (right) === -->
    <g filter="url(#nodeGlow)">
      <circle cx="920" cy="500" r="20" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.2"/>
      <circle cx="920" cy="500" r="14" fill="#22D3EE" opacity="0.12"/>
      <circle cx="920" cy="500" r="14" fill="none" stroke="#22D3EE" stroke-width="1.2" opacity="0.35"/>
      <circle cx="920" cy="500" r="5" fill="#22D3EE" opacity="0.85"/>
    </g>
    <text x="920" y="536" text-anchor="middle" fill="#22D3EE" font-family="SF Mono, Menlo, monospace" font-size="14" font-weight="500" opacity="0.4">RX</text>

    <!-- === Edge fade overlays (like the hero animation) === -->
    <rect x="32" y="32" width="80" height="960" fill="url(#fadeOut)"/>
    <rect x="912" y="32" width="80" height="960" fill="url(#fadeIn)"/>
    <rect x="32" y="32" width="960" height="48" fill="url(#fadeOutT)"/>
    <rect x="32" y="920" width="960" height="72" fill="url(#fadeOutB)"/>

    <!-- Status LED -->
    <circle cx="512" cy="810" r="7" fill="#34D399" filter="url(#dotGlow)" opacity="0.85"/>
    <circle cx="512" cy="810" r="3.5" fill="#A7F3D0"/>
  </g>

  <!-- Border -->
  <rect x="32" y="32" width="960" height="960" rx="216" fill="none" stroke="#fff" stroke-opacity="0.07" stroke-width="1.5"/>
  <path d="M 200 34 Q 512 -10 824 34" fill="none" stroke="#fff" stroke-opacity="0.15" stroke-width="2" stroke-linecap="round"/>
</svg>