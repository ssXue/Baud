name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build & Package
        run: ./package.sh "${{ steps.version.outputs.VERSION }}"

      - name: Generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SPARKLE_PRIVATE_KEY not set, skipping appcast generation"
            echo "skip_appcast=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # Download Sparkle's generate_appcast tool
          SPARKLE_VERSION=$(python3 -c "import json; pins=json.load(open('Package.resolved'))['pins']; print(next(p['state']['version'] for p in pins if 'sparkle' in p['identity'].lower()))" 2>/dev/null || echo "2.6.4")
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o sparkle.tar.xz
          tar xf sparkle.tar.xz
          GENERATE_APPCAST="bin/generate_appcast"

          mkdir -p Docs

          # Generate or update appcast.xml
          "$GENERATE_APPCAST" \
            --ed-key - \
            --channel stable \
            --output Docs/appcast.xml \
            dist/

      - name: Commit appcast
        if: env.skip_appcast != 'true'
        run: |
          if [ -f Docs/appcast.xml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Docs/appcast.xml
            git diff --cached --quiet || git commit -m "Update appcast.xml for v${{ env.VERSION }}"
            git push origin HEAD:main
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Baud ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/Baud-${{ steps.version.outputs.VERSION }}.dmg
